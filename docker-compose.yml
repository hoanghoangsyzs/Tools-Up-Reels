services:
  postgres:
    image: postgres:17
    container_name: reels_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reels_user
      POSTGRES_PASSWORD: dev_password_change_me
      POSTGRES_DB: reels_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reels_user -d reels_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reels_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  reels_worker:
    build:
      context: ./backend
    container_name: reels_worker
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://reels_user:dev_password_change_me@postgres:5432/reels_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-this-secret}
      VIDEO_STORAGE_DIR: /app/storage/videos
    volumes:
      - ./backend/storage:/app/storage
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  reels_scheduler:
    build:
      context: ./backend
    container_name: reels_scheduler
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://reels_user:dev_password_change_me@postgres:5432/reels_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-this-secret}
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: